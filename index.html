<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcor Logistics Go - Tiempo Real</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <!-- Supabase Client Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
    <div id="app" class="flex-grow flex flex-col">
        <div class="flex items-center justify-center flex-grow p-6">
            <div class="bg-slate-800 p-8 rounded-2xl shadow-xl max-w-md w-full border border-slate-700 text-center">
                <div class="bg-amber-500 w-16 h-16 mx-auto rounded-full flex items-center justify-center text-slate-900 text-2xl font-bold mb-4 animate-bounce">
                    <i class="fa-solid fa-truck-fast"></i>
                </div>
                <h1 class="text-2xl font-bold text-white mb-2">Arcor Logistics Go</h1>
                <p class="text-slate-400 text-sm mb-6">Conectando base de datos en vivo...</p>
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-amber-500 mx-auto"></div>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE BASE DE DATOS EN LA NUBE (TIEMPO REAL)
        // Puedes reemplazar estas 2 constantes con tus claves de Supabase o Firebase:
        const SUPABASE_URL = 'https://tu-proyecto.supabase.co';
        const SUPABASE_KEY = 'tu-anon-key-aqui';

        let db = null;
        if (typeof supabase !== 'undefined' && SUPABASE_URL !== 'https://tu-proyecto.supabase.co') {
            db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        const USERS_KEY = 'arcor_users_v5';
        const ORDERS_KEY = 'arcor_orders_v5';
        const SESSION_KEY = 'arcor_session_v5';

        let itemsTemp = [];

        function initStorage() {
            if (!localStorage.getItem(USERS_KEY)) {
                const defaultUsers = [
                    { legajo: 'ADM001', nombre: 'Administrador General', rol: 'admin', usuario: 'admin', pass: 'Arcor2026!', vehiculo: 'Sistema' },
                    { legajo: 'SUP001', nombre: 'Carlos Supervisor', rol: 'supervisor', usuario: 'carlos', pass: '1234', vehiculo: 'Oficina Central' },
                    { legajo: 'CHO001', nombre: 'Juan Chofer', rol: 'chofer', usuario: 'juan', pass: '1234', vehiculo: 'IVECO AA-123-BB' }
                ];
                localStorage.setItem(USERS_KEY, JSON.stringify(defaultUsers));
            }
            if (!localStorage.getItem(ORDERS_KEY)) {
                localStorage.setItem(ORDERS_KEY, JSON.stringify([]));
            }
        }

        function getSession() {
            const s = localStorage.getItem(SESSION_KEY);
            return s ? JSON.parse(s) : null;
        }

        function renderLogin() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="flex-grow flex items-center justify-center p-4 bg-slate-950">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 max-w-sm w-full shadow-2xl">
                        <div class="text-center mb-8">
                            <div class="bg-amber-500 w-14 h-14 mx-auto rounded-xl flex items-center justify-center text-slate-950 text-2xl font-black mb-3 shadow-lg shadow-amber-500/20">
                                <i class="fa-solid fa-box"></i>
                            </div>
                            <h1 class="text-xl font-bold text-white tracking-wide">ARCOR LOGISTICS</h1>
                            <p class="text-xs text-amber-400 font-semibold mt-1">Sincronización Multidispositivo</p>
                        </div>
                        <form id="loginForm" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Usuario</label>
                                <input type="text" id="user" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-500 transition">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Contraseña</label>
                                <input type="password" id="pass" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-500 transition">
                            </div>
                            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg shadow-amber-500/10 mt-2">
                                Ingresar al Sistema
                            </button>
                        </form>
                    </div>
                </div>
            `;

            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const u = document.getElementById('user').value.trim();
                const p = document.getElementById('pass').value.trim();
                const users = JSON.parse(localStorage.getItem(USERS_KEY));
                const found = users.find(x => x.usuario === u && x.pass === p);
                if (found) {
                    localStorage.setItem(SESSION_KEY, JSON.stringify(found));
                    router();
                } else {
                    alert('Usuario o contraseña incorrectos. Verificá mayúsculas.');
                }
            });
        }

        function renderAdmin() {
            const users = JSON.parse(localStorage.getItem(USERS_KEY));
            const app = document.getElementById('app');
            app.innerHTML = `
                <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
                    <div class="flex items-center space-x-3">
                        <div class="bg-amber-500 text-slate-950 p-2 rounded-lg font-bold"><i class="fa-solid fa-shield-halved"></i></div>
                        <div>
                            <h2 class="text-white font-bold text-sm">Panel Administrador</h2>
                            <p class="text-xs text-slate-400">Personal Registrado</p>
                        </div>
                    </div>
                    <button onclick="logout()" class="text-slate-400 hover:text-white text-sm font-medium"><i class="fa-solid fa-power-off mr-1"></i> Salir</button>
                </header>
                <main class="p-6 max-w-4xl mx-auto w-full space-y-6">
                    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-lg">
                        <h3 class="text-white font-bold text-base mb-4 flex items-center"><i class="fa-solid fa-user-plus text-amber-500 mr-2"></i> Registrar Nuevo Usuario</h3>
                        <form id="addUserForm" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <input type="text" id="legajo" placeholder="Legajo (ej: CHO002)" required class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white">
                            <input type="text" id="nombre" placeholder="Nombre y Apellido" required class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white">
                            <select id="rol" class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white">
                                <option value="chofer">Chofer</option>
                                <option value="supervisor">Supervisor</option>
                                <option value="admin">Administrador</option>
                            </select>
                            <input type="text" id="vehiculo" placeholder="Vehículo / Patente" class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white">
                            <input type="text" id="newuser" placeholder="Usuario de acceso" required class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white">
                            <input type="password" id="newpass" placeholder="Contraseña" required class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white">
                            <button type="submit" class="sm:col-span-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition shadow-md">Guardar Usuario</button>
                        </form>
                    </div>

                    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-lg">
                        <h3 class="text-white font-bold text-base mb-4 flex items-center"><i class="fa-solid fa-users text-amber-500 mr-2"></i> Usuarios del Sistema</h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm text-slate-300">
                                <thead class="border-b border-slate-700 text-xs uppercase text-slate-400">
                                    <tr>
                                        <th class="py-3 px-2">Legajo</th>
                                        <th class="py-3 px-2">Nombre</th>
                                        <th class="py-3 px-2">Rol</th>
                                        <th class="py-3 px-2">Vehículo</th>
                                        <th class="py-3 px-2 text-right">Acción</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-700/50">
                                    ${users.map(u => `
                                        <tr>
                                            <td class="py-3 px-2 font-mono text-amber-400">${u.legajo}</td>
                                            <td class="py-3 px-2 text-white font-medium">${u.nombre}</td>
                                            <td class="py-3 px-2 uppercase text-xs font-bold text-slate-400">${u.rol}</td>
                                            <td class="py-3 px-2">${u.vehiculo || '-'}</td>
                                            <td class="py-3 px-2 text-right">
                                                ${u.usuario !== 'admin' ? `<button onclick="deleteUser('${u.usuario}')" class="bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-white px-3 py-1 rounded-lg text-xs font-semibold transition">Eliminar</button>` : '<span class="text-xs text-slate-500">Sistema</span>'}
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </main>
            `;

            document.getElementById('addUserForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const newUser = {
                    legajo: document.getElementById('legajo').value,
                    nombre: document.getElementById('nombre').value,
                    rol: document.getElementById('rol').value,
                    vehiculo: document.getElementById('vehiculo').value,
                    usuario: document.getElementById('newuser').value,
                    pass: document.getElementById('newpass').value
                };
                users.push(newUser);
                localStorage.setItem(USERS_KEY, JSON.stringify(users));
                alert('Usuario guardado exitosamente');
                renderAdmin();
            });
        }

        window.deleteUser = function(username) {
            if (confirm('¿Eliminar este usuario?')) {
                let users = JSON.parse(localStorage.getItem(USERS_KEY));
                users = users.filter(u => u.usuario !== username);
                localStorage.setItem(USERS_KEY, JSON.stringify(users));
                renderAdmin();
            }
        };

        function renderSupervisor() {
            const users = JSON.parse(localStorage.getItem(USERS_KEY));
            const choferes = users.filter(u => u.rol === 'chofer');
            const orders = JSON.parse(localStorage.getItem(ORDERS_KEY));
            const app = document.getElementById('app');

            app.innerHTML = `
                <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
                    <div class="flex items-center space-x-3">
                        <div class="bg-amber-500 text-slate-950 p-2 rounded-lg font-bold"><i class="fa-solid fa-route"></i></div>
                        <div>
                            <h2 class="text-white font-bold text-sm">Panel Supervisor</h2>
                            <p class="text-xs text-slate-400">Carga de Pedidos e Ítems</p>
                        </div>
                    </div>
                    <button onclick="logout()" class="text-slate-400 hover:text-white text-sm font-medium"><i class="fa-solid fa-power-off mr-1"></i> Salir</button>
                </header>
                <main class="p-6 max-w-4xl mx-auto w-full space-y-6">
                    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-lg">
                        <h3 class="text-white font-bold text-base mb-4 flex items-center"><i class="fa-solid fa-cart-plus text-amber-500 mr-2"></i> Crear Pedido Nuevo</h3>
                        
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                            <input type="text" id="comercio" placeholder="Comercio / Cliente" required class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white">
                            <input type="text" id="direccion" placeholder="Dirección de Entrega" required class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white">
                            <select id="choferAsignado" required class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white sm:col-span-2">
                                <option value="">Seleccionar Chofer...</option>
                                ${choferes.map(c => `<option value="${c.nombre}">${c.nombre} (${c.vehiculo})</option>`).join('')}
                            </select>
                        </div>

                        <div class="bg-slate-900/60 border border-slate-700/80 rounded-xl p-4 mb-4">
                            <h4 class="text-xs font-bold uppercase text-amber-400 mb-3"><i class="fa-solid fa-box-open mr-1"></i> Ítems del Pedido</h4>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-3">
                                <input type="text" id="prodNombre" placeholder="Producto" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white">
                                <input type="number" id="prodCant" placeholder="Cantidad" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white">
                                <input type="number" id="prodPrecio" placeholder="Precio Un. ($)" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white">
                            </div>
                            <button type="button" onclick="agregarProductoTemp()" class="w-full bg-slate-800 hover:bg-slate-700 text-amber-400 font-semibold py-2 rounded-lg text-xs border border-amber-500/30 transition">
                                + Agregar Producto a la Lista
                            </button>

                            <div id="listaProdTemp" class="mt-4 space-y-1"></div>
                            <div class="mt-3 pt-2 border-t border-slate-800 flex justify-between items-center text-sm font-bold text-white">
                                <span>TOTAL CALCULADO:</span>
                                <span id="totalCalculado" class="text-amber-400 text-base">$0</span>
                            </div>
                        </div>

                        <button type="button" onclick="despacharPedido()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition shadow-md">
                            Despachar Pedido al Chofer
                        </button>
                    </div>

                    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-lg">
                        <h3 class="text-white font-bold text-base mb-4 flex items-center"><i class="fa-solid fa-clock-rotate-left text-amber-500 mr-2"></i> Historial de Envíos</h3>
                        <div class="space-y-3">
                            ${orders.length === 0 ? '<p class="text-slate-500 text-sm text-center py-4">No hay envíos guardados.</p>' : orders.map(o => `
                                <div class="bg-slate-900 border border-slate-700/60 rounded-xl p-4">
                                    <div class="flex justify-between items-start mb-2">
                                        <div>
                                            <span class="text-white font-bold text-base">${o.comercio}</span>
                                            <span class="ml-2 px-2 py-0.5 rounded text-xs font-bold ${o.estado === 'Entregado' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}">${o.estado}</span> </div> <span class="text-amber-400 font-bold text-base">$${o.total}</span>
                                    </div>
                                    <p class="text-xs text-slate-400 mb-2"><i class="fa-solid fa-location-dot mr-1"></i> ${o.direccion} | <i class="fa-solid fa-truck mr-1"></i> ${o.chofer}</p>
                                    <div class="bg-slate-950/50 rounded-lg p-2 text-xs text-slate-300 space-y-1 mb-2">
                                        ${o.items.map(i => `<div class="flex justify-between"><span>• ${i.nombre} (x${i.cant})</span><span class="text-slate-400">$${i.cant * i.precio}</span></div>`).join('')}
                                    </div>
                                    ${o.fechaHora ? `<p class="text-xs text-emerald-400 font-mono">🕒 Entregado: ${o.fechaHora} (${o.pago})</p>` : ''}
                                    ${o.foto ? `<img src="${o.foto}" class="mt-2 w-20 h-20 object-cover rounded-lg border border-slate-700"/>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </main>
            `;
            renderItemsTemp();
        }

        window.agregarProductoTemp = function() {
            const nombre = document.getElementById('prodNombre').value.trim();
            const cant = parseFloat(document.getElementById('prodCant').value);
            const precio = parseFloat(document.getElementById('prodPrecio').value);

            if (!nombre || isNaN(cant) || isNaN(precio)) {
                alert('Completá nombre, cantidad y precio unitario.');
                return;
            }

            itemsTemp.push({ nombre, cant, precio });
            document.getElementById('prodNombre').value = '';
            document.getElementById('prodCant').value = '';
            document.getElementById('prodPrecio').value = '';
            renderItemsTemp();
        };

        function renderItemsTemp() {
            const container = document.getElementById('listaProdTemp');
            const totalEl = document.getElementById('totalCalculado');
            if (!container) return;

            if (itemsTemp.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-500 italic">No agregaste productos.</p>';
                totalEl.innerText = '$0';
                return;
            }

            let total = 0;
            container.innerHTML = itemsTemp.map((item, idx) => {
                const subtotal = item.cant * item.precio;
                total += subtotal;
                return `
                    <div class="flex justify-between items-center text-xs bg-slate-800 px-3 py-1.5 rounded border border-slate-700">
                        <span class="text-white">${item.nombre} x${item.cant} <span class="text-slate-400">($${item.precio}/u)</span></span>
                        <div class="flex items-center space-x-2">
                            <span class="text-amber-400 font-bold">$${subtotal}</span>
                            <button type="button" onclick="quitarProductoTemp(${idx})" class="text-red-400 hover:text-red-300 font-bold ml-2">✕</button>
                        </div>
                    </div>
                `;
            }).join('');

            totalEl.innerText = `$${total}`;
        }

        window.quitarProductoTemp = function(idx) {
            itemsTemp.splice(idx, 1);
            renderItemsTemp();
        };

        window.despacharPedido = function() {
            const comercio = document.getElementById('comercio').value.trim();
            const direccion = document.getElementById('direccion').value.trim();
            const chofer = document.getElementById('choferAsignado').value;

            if (!comercio || !direccion || !chofer) {
                alert('Completá comercio, dirección y chofer.');
                return;
            }

            if (itemsTemp.length === 0) {
                alert('Agregá al menos un producto.');
                return;
            }

            const total = itemsTemp.reduce((acc, item) => acc + (item.cant * item.precio), 0);

            const orders = JSON.parse(localStorage.getItem(ORDERS_KEY));
            const newOrder = {
                id: Date.now(),
                comercio,
                direccion,
                chofer,
                items: [...itemsTemp],
                total,
                estado: 'Pendiente',
                fechaHora: null,
                pago: null,
                foto: null
            };

            orders.push(newOrder);
            localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));

            itemsTemp = [];
            alert('¡Pedido despachado con éxito!');
            renderSupervisor();
        };

        function renderChofer() {
            const session = getSession();
            let orders = JSON.parse(localStorage.getItem(ORDERS_KEY));
            const misPedidos = orders.filter(o => o.chofer === session.nombre && o.estado === 'Pendiente');
            const app = document.getElementById('app');

            app.innerHTML = `
                <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
                    <div class="flex items-center space-x-3">
                        <div class="bg-amber-500 text-slate-950 p-2 rounded-lg font-bold"><i class="fa-solid fa-truck"></i></div>
                        <div>
                            <h2 class="text-white font-bold text-sm">Chofer: ${session.nombre}</h2>
                            <p class="text-xs text-slate-400">${session.vehiculo}</p>
                        </div>
                    </div>
                    <button onclick="logout()" class="text-slate-400 hover:text-white text-sm font-medium"><i class="fa-solid fa-power-off mr-1"></i> Salir</button>
                </header>
                <main class="p-6 max-w-md mx-auto w-full space-y-4">
                    <h3 class="text-white font-bold text-base mb-2">Entregas Pendientes</h3>
                    ${misPedidos.length === 0 ? '<div class="bg-slate-800 p-6 rounded-2xl text-center text-slate-400 text-sm">No tenés pedidos pendientes.</div>' : misPedidos.map(o => `
                        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 space-y-3 shadow-lg">
                            <div class="flex justify-between items-start">
                                <h4 class="text-white font-bold text-base">${o.comercio}</h4> <span class="text-amber-400 font-bold text-lg">$${o.total}</span>
                            </div>
                            <p class="text-xs text-slate-300"><i class="fa-solid fa-location-dot text-amber-500 mr-1"></i> ${o.direccion}</p>
                            
                            <div class="bg-slate-900/80 rounded-xl p-3 text-xs text-slate-300 space-y-1">
                                <p class="font-bold text-amber-400 uppercase text-micro mb-1">Productos:</p>
                                ${o.items.map(i => `<div class="flex justify-between"><span>• ${i.nombre} (x${i.cant})</span><span>$${i.cant * i.precio}</span></div>`).join('')}
                            </div>

                            <div class="pt-2 border-t border-slate-700 space-y-3">
                                <div>
                                    <label class="block text-xs text-slate-400 mb-1">Método de Cobro</label>
                                    <select id="pago_${o.id}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                                        <option value="Efectivo">💵 Efectivo</option>
                                        <option value="Transferencia">📲 Transferencia</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs text-slate-400 mb-1">Foto Comprobante</label>
                                    <input type="file" accept="image/*" id="foto_${o.id}" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-400">
                                </div>
                                <button onclick="entregarPedido(${o.id})" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl text-sm transition shadow-md">
                                    Confirmar Entrega y Sellar Hora
                                </button>
                            </div>
                        </div>
                    `).join('')}
                </main>
            `;
        }

        window.entregarPedido = function(id) {
            const pagoVal = document.getElementById(`pago_${id}`).value;
            const fotoInput = document.getElementById(`foto_${id}`);
            
            let orders = JSON.parse(localStorage.getItem(ORDERS_KEY));
            const orderIndex = orders.findIndex(o => o.id === id);

            if (orderIndex !== -1) {
                const now = new Date();
                const fechaHoraExacta = now.toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'medium' });

                orders[orderIndex].estado = 'Entregado';
                orders[orderIndex].pago = pagoVal;
                orders[orderIndex].fechaHora = fechaHoraExacta;

                if (fotoInput.files && fotoInput.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        orders[orderIndex].foto = e.target.result;
                        localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
                        alert('¡Entrega registrada con éxito!');
                        renderChofer();
                    };
                    reader.readAsDataURL(fotoInput.files[0]);
                } else {
                    localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
                    alert('¡Entrega registrada con éxito!');
                    renderChofer();
                }
            }
        };

        window.logout = function() {
            localStorage.removeItem(SESSION_KEY);
            router();
        }

        function router() {
            initStorage();
            const session = getSession();
            if (!session) {
                renderLogin();
            } else if (session.rol === 'admin') {
                renderAdmin();
            } else if (session.rol === 'supervisor') {
                renderSupervisor();
            } else if (session.rol === 'chofer') {
                renderChofer();
            }
        }

        router();
    </script>
</body>
</html>
