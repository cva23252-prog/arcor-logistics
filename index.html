                    if (!error && users && users.length > 0) {

                } catch (err) {
                    console.log('Error de conexión:', err);

                if (u === 'admin' && p === 'Arcor2026!') {
                    const adm = { legajo: 'ADM001', nombre: 'Administrador General', rol: 'admin', usuario: 'admin', pass: 'Arcor2026!', vehiculo: 'Sistema' };
                    localStorage.setItem(SESSION_KEY, JSON.stringify(adm));

                } else if (u === 'carlos' && p === '1234') {

                        <form id="addUserForm" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <input type="text" id="legajo" placeholder="Legajo (ej: CHO002)" required class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white">

                                            <td class="py-3 px-2 uppercase text-xs font-bold text-slate-400">${u.rol}</td>
                                            <td class="py-3 px-2">${u.vehiculo || '-'}</td>
                                            <td class="py-3 px-2 text-right">
                                                ${u.usuario !== 'admin' ? `<button onclick="deleteUser('${u.usuario}')" class="bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-white px-3 py-1 rounded-lg text-xs font-semibold transition">Eliminar</button>` : '<span class="text-xs text-slate-500">Sistema</span>'}

                            </table>

            document.getElementById('addUserForm').addEventListener('submit', async (e) => {

                };
                await _supabase.from('usuarios').upsert([newUser]);
                alert('Usuario guardado exitosamente');

        window.deleteUser = async function(username) {
            if (confirm('¿Eliminar usuario?')) {
                await _supabase.from('usuarios').delete().eq('usuario', username);

        async function renderSupervisor() {
            let choferes = [];
            try {
                const { data } = await _supabase.from('usuarios').select('*').eq('rol', 'chofer');
                if (data) choferes = data;
            } catch(e){}

            if(choferes.length === 0) {
                choferes = [{ nombre: 'Juan Chofer', vehiculo: 'IVECO AA-123-BB' }];
            }

            const app = document.getElementById('app');
            app.innerHTML = `
                <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
                    <div class="flex items-center space-x-3">
                        <div class="bg-amber-500 text-slate-950 p-2 rounded-lg font-bold"><i class="fa-solid fa-route"></i></div>
                        <div>
                            <h2 class="text-white font-bold text-sm">Panel Supervisor</h2>
                            <p class="text-xs text-slate-400">Despacho en Tiempo Real</p>
                        </div>
                    </div>
                    <button onclick="logout()" class="text-slate-400 hover:text-white text-sm font-medium"><i class="fa-solid fa-power-off mr-1"></i> Salir</button>
                </header>
                <main class="p-6 max-w-4xl mx-auto w-full space-y-6">
                    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-lg">
                        <h3 class="text-white font-bold text-base mb-4 flex items-center"><i class="fa-solid fa-cart-plus text-amber-500 mr-2"></i> Crear Pedido Detallado</h3>
                        
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                            <input type="text" id="comercio" placeholder="Comercio / Cliente" required class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white">
                            <input type="text" id="direccion" placeholder="Dirección de Entrega" required class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white">
                            <select id="choferAsignado" required class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white sm:col-span-2">
                                <option value="">Seleccionar Chofer...</option>
                                ${choferes.map(c => `<option value="${c.nombre}">${c.nombre} (${c.vehiculo})</option>`).join('')}
                            </select>
                        </div>

                        <div class="bg-slate-900/60 border border-slate-700/80 rounded-xl p-4 mb-4">
                            <h4 class="text-xs font-bold uppercase text-amber-400 mb-3"><i class="fa-solid fa-box-open mr-1"></i> Ítems del Pedido</h4>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-3">
                                <input type="text" id="prodNombre" placeholder="Producto" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white">
                                <input type="number" id="prodCant" placeholder="Cantidad" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white">
                                <input type="number" id="prodPrecio" placeholder="Precio Un. ($)" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white">
                            </div>
                            <button type="button" onclick="agregarProductoTemp()" class="w-full bg-slate-800 hover:bg-slate-700 text-amber-400 font-semibold py-2 rounded-lg text-xs border border-amber-500/30 transition">
                                + Agregar Producto a la Lista
                            </button>

                            <div id="listaProdTemp" class="mt-4 space-y-1"></div>
                            <div class="mt-3 pt-2 border-t border-slate-800 flex justify-between items-center text-sm font-bold text-white">
                                <span>TOTAL CALCULADO:</span>
                                <span id="totalCalculado" class="text-amber-400 text-base">$0</span>
                            </div>
                        </div>

                        <button type="button" onclick="despacharPedido()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition shadow-md">
                            Despachar Pedido a la Nube
                        </button>
                    </div>

                    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-lg">
                        <h3 class="text-white font-bold text-base mb-4 flex items-center"><i class="fa-solid fa-clock-rotate-left text-amber-500 mr-2"></i> Envíos Despachados</h3>
                        <div id="listaPedidosSupervisor" class="space-y-3">

            renderItemsTemp();

        async function cargarPedidosSupervisor() {
            const { data: orders, error } = await _supabase.from('pedidos').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('listaPedidosSupervisor');
            if (!container) return;

            if (error || !orders || orders.length === 0) {
                container.innerHTML = '<p class="text-slate-500 text-sm text-center py-4">No hay pedidos asignados todavía.</p>';
                return;
            }

            container.innerHTML = orders.map(o => `
                <div class="bg-slate-900 border border-slate-700/60 rounded-xl p-4">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <span class="text-white font-bold text-base">${o.comercio}</span>
                            <span class="ml-2 px-2 py-0.5 rounded text-xs font-bold ${o.estado === 'Entregado' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}">${o.estado}</span>
                        </div>
                        <span class="text-amber-400 font-bold text-base">$${o.total}</span>
                    </div>
                    <p class="text-xs text-slate-400 mb-2"><i class="fa-solid fa-location-dot mr-1"></i> ${o.direccion} | <i class="fa-solid fa-truck mr-1"></i> ${o.chofer}</p>
                    <div class="bg-slate-950/50 rounded-lg p-2 text-xs text-slate-300 space-y-1 mb-2">
                        ${o.items ? o.items.map(i => `<div class="flex justify-between"><span>• ${i.nombre} (x${i.cant})</span><span class="text-slate-400">$${i.cant * i.precio}</span></div>`).join('') : ''}
                    </div>
                    ${o.fechaHora ? `<p class="text-xs text-emerald-400 font-mono">🕒 Entregado: ${o.fechaHora} (${o.pago})</p>` : ''}
                    ${o.foto ? `<img src="${o.foto}" class="mt-2 w-20 h-20 object-cover rounded-lg border border-slate-700"/>` : ''}
                </div>
            `).join('');
        }

        function suscripcionRealtimeSupervisor() {
            _supabase
                .channel('public:pedidos_supervisor')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos' }, payload => {
                    cargarPedidosSupervisor();
                })
                .subscribe();
        }

        window.agregarProductoTemp = function() {
            const nombre = document.getElementById('prodNombre').value.trim();
            const cant = parseFloat(document.getElementById('prodCant').value);
            const precio = parseFloat(document.getElementById('prodPrecio').value);

            if (!nombre || isNaN(cant) || isNaN(precio)) {
                alert('Completá nombre, cantidad y precio.');
                return;
            }

            itemsTemp.push({ nombre, cant, precio });
            document.getElementById('prodNombre').value = '';
            document.getElementById('prodCant').value = '';
            document.getElementById('prodPrecio').value = '';
            renderItemsTemp();
        };

        function renderItemsTemp() {
            const container = document.getElementById('listaProdTemp');
            const totalEl = document.getElementById('totalCalculado');
            if (!container) return;

            if (itemsTemp.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-500 italic">No hay productos agregados.</p>';
                totalEl.innerText = '$0';
                return;
            }

            let total = 0;
            container.innerHTML = itemsTemp.map((item, idx) => {
                const subtotal = item.cant * item.precio;
                total += subtotal;
                return `
                    <div class="flex justify-between items-center text-xs bg-slate-800 px-3 py-1.5 rounded border border-slate-700">
                        <span class="text-white">${item.nombre} x${item.cant} <span class="text-slate-400">($${item.precio}/u)</span></span>
                        <div class="flex items-center space-x-2">
                            <span class="text-amber-400 font-bold">$${subtotal}</span>
                            <button type="button" onclick="quitarProductoTemp(${idx})" class="text-red-400 font-bold ml-2">✕</button>
                        </div>
                    </div>
                `;
            }).join('');
            totalEl.innerText = `$${total}`;
        }

        window.quitarProductoTemp = function(idx) {
            itemsTemp.splice(idx, 1);
            renderItemsTemp();
        };

        window.despacharPedido = async function() {
            const comercio = document.getElementById('comercio').value.trim();
            const direccion = document.getElementById('direccion').value.trim();
            const chofer = document.getElementById('choferAsignado').value;

            if (!comercio || !direccion || !chofer) {
                alert('Completá comercio, dirección y chofer.');
                return;
            }
            if (itemsTemp.length === 0) {
                alert('Agregá al menos un producto.');
                return;
            }

            const total = itemsTemp.reduce((acc, item) => acc + (item.cant * item.precio), 0);
            const orderId = 'ord_' + Date.now();

            const newOrder = {
                id: orderId,
                comercio,
                direccion,
                chofer,
                items: [...itemsTemp],
                total,
                estado: 'Pendiente',
                fechaHora: null,
                pago: null,
                foto: null
            };

            const { error } = await _supabase.from('pedidos').insert([newOrder]);
            if (error) {
                alert('Error al despachar pedido: ' + error.message);
                return;
            }

            itemsTemp = [];
            alert('¡Pedido despachado a la nube con éxito!');
            renderSupervisor();
        };

        function renderChofer() {
            const session = getSession();
            const app = document.getElementById('app');

            app.innerHTML = `
                <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
                    <div class="flex items-center space-x-3">
                        <div class="bg-amber-500 text-slate-950 p-2 rounded-lg font-bold"><i class="fa-solid fa-truck"></i></div>
                        <div>
                            <h2 class="text-white font-bold text-sm">Chofer: ${session.nombre}</h2>
                            <p class="text-xs text-slate-400">${session.vehiculo}</p>
                        </div>
                    </div>
                    <button onclick="logout()" class="text-slate-400 hover:text-white text-sm font-medium"><i class="fa-solid fa-power-off mr-1"></i> Salir</button>
                </header>
                <main class="p-6 max-w-4xl mx-auto w-full space-y-4">
                    <h3 class="text-white font-bold text-base mb-2">Entregas Pendientes (En Vivo)</h3>
                    <div id="listaPedidosChofer" class="space-y-4">
                        <p class="text-slate-500 text-sm text-center py-4">Buscando entregas asignadas...</p>
                    </div>

            `;

            cargarPedidosChofer(session.nombre);
            suscripcionRealtimeChofer(session.nombre);
        }

        async function cargarPedidosChofer(nombreChofer) {
            const { data: orders, error } = await _supabase
                .from('pedidos')
                .select('*')
                .eq('chofer', nombreChofer)
                .eq('estado', 'Pendiente');

            const container = document.getElementById('listaPedidosChofer');
            if (!container) return;

            if (error || !orders || orders.length === 0) {
                container.innerHTML = '<div class="bg-slate-800 p-6 rounded-2xl text-center text-slate-400 text-sm">No tenés pedidos pendientes.</div>';
                return;
            }

            container.innerHTML = orders.map(o => `
                <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 space-y-3 shadow-lg">
                    <div class="flex justify-between items-start">
                        <h4 class="text-white font-bold text-base">${o.comercio}</h4>
                        <span class="text-amber-400 font-bold text-lg">$${o.total}</span>
                    </div>
                    <p class="text-xs text-slate-300"><i class="fa-solid fa-location-dot text-amber-500 mr-1"></i> ${o.direccion}</p>
                    
                    <div class="bg-slate-900/80 rounded-xl p-3 text-xs text-slate-300 space-y-1">
                        <p class="font-bold text-amber-400 uppercase mb-1">Productos:</p>
                        ${o.items ? o.items.map(i => `<div class="flex justify-between"><span>• ${i.nombre} (x${i.cant})</span><span>$${i.cant * i.precio}</span></div>`).join('') : ''}
                    </div>

                    <div class="pt-2 border-t border-slate-700 space-y-3">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Método de Cobro</label>
                            <select id="pago_${o.id}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                                <option value="Efectivo">💵 Efectivo</option>
                                <option value="Transferencia">📲 Transferencia</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Foto Comprobante</label>
                            <input type="file" accept="image/*" id="foto_${o.id}" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-400">
                        </div>
                        <button onclick="entregarPedido('${o.id}')" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl text-sm transition shadow-md">
                            Confirmar Entrega
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function suscripcionRealtimeChofer(nombreChofer) {
            _supabase
                .channel('public:pedidos_chofer')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos' }, payload => {
                    cargarPedidosChofer(nombreChofer);
                })
                .subscribe();
        }

        window.entregarPedido = async function(idOrden) {
            const pagoVal = document.getElementById(`pago_${idOrden}`).value;
            const fotoInput = document.getElementById(`foto_${idOrden}`);
            
            const now = new Date();
            const fechaHoraExacta = now.toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'medium' });

            let updateData = {
                estado: 'Entregado',
                pago: pagoVal,
                fechaHora: fechaHoraExacta
            };

            if (fotoInput.files && fotoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    updateData.foto = e.target.result;
                    const { error } = await _supabase.from('pedidos').update(updateData).eq('id', idOrden);
                    if (!error) alert('¡Entrega confirmada y sincronizada!');
                };
                reader.readAsDataURL(fotoInput.files[0]);
            } else {
                const { error } = await _supabase.from('pedidos').update(updateData).eq('id', idOrden);
                if (!error) alert('¡Entrega confirmada y sincronizada!');
            }
        };

        window.logout = function() {
            localStorage.removeItem(SESSION_KEY);
            router();
        }

        function router() {
            const session = getSession();
            if (!session) {
                renderLogin();
            } else if (session.rol === 'admin') {
                renderAdmin();
            } else if (session.rol === 'supervisor') {
                renderSupervisor();
            } else if (session.rol === 'chofer') {
                renderChofer();
            }
        }

        router();
    </script>
</body>
</html>
