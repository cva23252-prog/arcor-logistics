<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcor Logistics Go - Supabase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="app" class="flex flex-col p-4 max-w-md mx-auto min-h-screen">
        
        <!-- Header -->
        <header class="flex justify-between items-center mb-6 bg-slate-800 p-4 rounded-2xl shadow-lg border border-slate-700">
            <div>
                <h1 class="text-xl font-bold text-white">Arcor Logistics</h1>
                <p class="text-xs text-amber-400 font-medium">Sincronización en Vivo</p>
            </div>
            <div id="user-role-badge" class="bg-slate-700 px-3 py-1 rounded-full text-xs font-semibold text-slate-300">
                Seleccionando Rol...
            </div>
        </header>

        <!-- Selector de Rol (Inicial) -->
        <div id="role-selector" class="my-auto bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 text-center">
            <h2 class="text-lg font-bold mb-4 text-white">¿Cómo deseas ingresar?</h2>
            <div class="space-y-3">
                <button onclick="setRole('supervisor')" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold p-3 rounded-xl transition shadow-lg">
                    <i class="fa-solid fa-user-tie mr-2"></i> Supervisor
                </button>
                <button onclick="setRole('chofer')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-xl transition shadow-lg">
                    <i class="fa-solid fa-truck-fast mr-2"></i> Chofer
                </button>
            </div>
        </div>

        <!-- Panel de Supervisor -->
        <div id="supervisor-panel" class="hidden flex-col space-y-4">
            <div class="bg-slate-800 p-4 rounded-2xl shadow-lg border border-slate-700">
                <h2 class="text-md font-bold mb-3 text-white"><i class="fa-solid fa-plus-circle mr-2 text-amber-500"></i>Nuevo Pedido</h2>
                <form id="order-form" onsubmit="crearPedido(event)" class="space-y-3">
                    <input type="text" id="cliente" placeholder="Nombre del Cliente" required class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm text-white focus:outline-none focus:border-amber-500">
                    <input type="text" id="direccion" placeholder="Dirección de Entrega" required class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm text-white focus:outline-none focus:border-amber-500">
                    <input type="text" id="chofer" placeholder="Chofer Asignado" required class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm text-white focus:outline-none focus:border-amber-500">
                    <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold p-3 rounded-xl text-sm transition">
                        Registrar y Enviar
                    </button>
                </form>
            </div>
        </div>

        <!-- Lista de Pedidos (Común para ambos) -->
        <div id="main-content" class="hidden flex-col flex-grow space-y-4 mt-2">
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider">Lista de Pedidos</h3>
                <button onclick="cambiarRol()" class="text-xs text-amber-400 underline">Cambiar de Rol</button>
            </div>
            <div id="pedidos-list" class="space-y-3 pb-6">
                <!-- Los pedidos se cargan aquí dinámicamente -->
                <p class="text-center text-slate-500 text-sm py-6">Cargando pedidos...</p>
            </div>
        </div>
    </div>

    <script>
        // Configuración de Supabase
        const SUPABASE_URL = 'https://uxaibhplafdnifwizjec.supabase.co';
        const SUPABASE_ANON_KEY = 'PEGAR_AQUI_TU_CLAVE_SB_PUBL'; const SUPABASE_ANON_KEY = 'sb_publ_tu_clave_larga_aqui...';

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentRole = null;

        function setRole(role) {
            currentRole = role;
            document.getElementById('role-selector').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            
            const badge = document.getElementById('user-role-badge');
            if (role === 'supervisor') {
                document.getElementById('supervisor-panel').classList.remove('hidden');
                badge.textContent = 'Supervisor';
                badge.className = 'bg-amber-500/20 text-amber-400 border border-amber-500/30 px-3 py-1 rounded-full text-xs font-semibold';
            } else {
                document.getElementById('supervisor-panel').classList.add('hidden');
                badge.textContent = 'Chofer';
                badge.className = 'bg-blue-500/20 text-blue-400 border border-blue-500/30 px-3 py-1 rounded-full text-xs font-semibold';
            }
            cargarPedidos();
            suscripcionRealtime();
        }

        function cambiarRol() {
            currentRole = null;
            document.getElementById('role-selector').classList.remove('hidden');
            document.getElementById('main-content').classList.add('hidden');
            document.getElementById('supervisor-panel').classList.add('hidden');
            document.getElementById('user-role-badge').textContent = 'Seleccionando Rol...';
            document.getElementById('user-role-badge').className = 'bg-slate-700 px-3 py-1 rounded-full text-xs font-semibold text-slate-300';
        }

        // Crear pedido (Supervisor)
        async function crearPedido(e) {
            e.preventDefault();
            const cliente = document.getElementById('cliente').value;
            const direccion = document.getElementById('direccion').value;
            const chofer = document.getElementById('chofer').value;

            const { data, error } = await _supabase
                .from('pedidos')
                .insert([{ cliente, direccion, chofer, estado: 'pendiente' }]);

            if (error) {
                alert('Error al crear pedido: ' + error.message);
            } else {
                document.getElementById('order-form').reset();
            }
        }

        // Cargar pedidos desde Supabase
        async function cargarPedidos() {
            const { data, error } = await _supabase
                .from('pedidos')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                console.error('Error cargando pedidos:', error);
                return;
            }
            renderizarPedidos(data);
        }

        // Renderizar en pantalla
        function renderizarPedidos(pedidos) {
            const container = document.getElementById('pedidos-list');
            if (!pedidos || pedidos.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-500 text-sm py-6">No hay pedidos registrados.</p>';
                return;
            }

            container.innerHTML = pedidos.map(p => `
                <div class="bg-slate-800 p-4 rounded-2xl shadow-lg border border-slate-700 flex flex-col space-y-2">
                    <div class="flex justify-between items-start">
                        <h4 class="font-bold text-white text-base">${p.cliente}</h4>
                        <span class="text-xs px-2.5 py-1 rounded-full font-semibold ${p.estado === 'entregado' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}">
                            ${p.estado.toUpperCase()}
                        </span>
                    </div>
                    <p class="text-xs text-slate-400"><i class="fa-solid fa-location-dot mr-1"></i> ${p.direccion}</p>
                    <p class="text-xs text-slate-300"><i class="fa-solid fa-user mr-1"></i> Chofer: <span class="font-medium text-white">${p.chofer}</span></p>
                    ${currentRole === 'chofer' && p.estado !== 'entregado' ? `
                        <button onclick="marcarEntregado(${p.id})" class="mt-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2 px-4 rounded-xl transition">
                            Marcar como Entregado
                        </button>
                    ` : ''}
                </div>
            `).join('');
        }

        // Actualizar estado (Chofer)
        async function marcarEntregado(id) {
            const { error } = await _supabase
                .from('pedidos')
                .update({ estado: 'entregado' })
                .eq('id', id);

            if (error) {
                alert('Error al actualizar: ' + error.message);
            }
        }

        // Sincronización en Tiempo Real (Realtime)
        function suscripcionRealtime() {
            _supabase
                .channel('public:pedidos')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos' }, payload => {
                    cargarPedidos();
                })
                .subscribe();
        }
    </script>
</body>
</html>
